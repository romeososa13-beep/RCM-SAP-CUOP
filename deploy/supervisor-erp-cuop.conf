; /etc/supervisor/conf.d/erp-cuop.conf
; Procesa en segundo plano los correos de recibos y los mensajes de WhatsApp.
[program:erp-cuop-cola]
command=php /var/www/erp-cuop/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
user=www-data
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/erp-cuop/storage/logs/cola.log
