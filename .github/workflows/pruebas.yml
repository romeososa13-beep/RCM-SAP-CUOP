name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas (${{ matrix.db }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        db: [mysql, sqlite]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: erp_cuop_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_sqlite, mbstring, intl, gd, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          composer install --no-interaction --prefer-dist --no-progress
          npm ci
          npm run build

      - name: Entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Formato (Pint)
        if: matrix.db == 'mysql'
        run: vendor/bin/pint --test

      - name: Auditoría de seguridad
        if: matrix.db == 'mysql'
        run: composer audit

      - name: Pruebas
        env:
          DB_CONNECTION: ${{ matrix.db }}
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ${{ matrix.db == 'mysql' && 'erp_cuop_test' || ':memory:' }}
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test
