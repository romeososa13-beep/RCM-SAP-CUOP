[www]
user = www-data
group = www-data
listen = /run/php/php-fpm.sock
listen.owner = www-data
listen.group = www-data
; Las variables del contenedor (.env) deben llegar a PHP.
clear_env = no
; Un solo usuario: pocos procesos para cuidar la memoria del equipo.
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
