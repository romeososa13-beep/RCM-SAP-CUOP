[program:php-fpm]
command=php-fpm8.3 -F
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Recargos, mensualidad y recordatorios (cada minuto revisa qué toca)
[program:programador]
command=php /var/www/artisan schedule:work
user=www-data
autorestart=true
stdout_logfile=/var/www/storage/logs/programador.log
redirect_stderr=true

; Correos de recibos y mensajes de WhatsApp
[program:cola]
command=php /var/www/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
user=www-data
autorestart=true
stopwaitsecs=60
stdout_logfile=/var/www/storage/logs/cola.log
redirect_stderr=true
